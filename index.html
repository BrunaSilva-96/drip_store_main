<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>E-comerce</title>
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://fonts.googleapis.com/css?family=Inter"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- inicio header abaixo-->

    <div class="container-global">
      <div class="titulo-digitalColleger">
        <img src="../Assets/logo.png" alt="logo" />
        <input type="text" placeholder="Pesquisar Produto..." />
        <img id="lupa" src="./Assets/Search.png" alt="lupa" />
        <div class="cad-ent-carrinh">
          <div class="cadastrar">
            <a href="#">Cadastre-se</a>
          </div>
          <div class="entrar">
            <a href="#"><button type="submit">Entrar</button></a>
          </div>
          <div class="carrinho">
            <a href="#"
              ><img src="./Assets/Group 53581.png" alt="carrinho"
            /></a>
          </div>
        </div>
      </div>
      <div class="barra-navegacao">
        <nav>
          <ul>
            <li><a href="#">Home </a></li>
            <li><a href="#">Produtos </a></li>
            <li><a href="#">Categorias </a></li>
            <li><a href="#">Meus Pedidos </a></li>
          </ul>
        </nav>
      </div>
    </div>
    <!-- Fim do header acima -->

    <!-- Inicio da seção coleçoes em destaque-->

    <div class="global-Colecoes">
      <h2>Coleções em destaque</h2>
      <div class="produt-destq">
        <div class="camisa">
          <button>30% OFF</button>
          <p>
            Novo drop <br />
            Supreme
          </p>
          <img src="./Assets/Group 53583.png" alt="camisa" />
        </div>
        <div class="tenis">
          <button>30% OFF</button>
          <p>
            Coleção <br />
            Adidas
          </p>
          <img src="./Assets/Group 53584.png" alt="tenis" />
        </div>
        <div class="fone">
          <button>30% OFF</button>
          <p>
            Novo <br />
            Beats Bass
          </p>
          <img src="./Assets/Group 53585.png" alt="fone" />
        </div>
        <div class="icons-destaq"></div>
      </div>
      <!-- Inicio da parte 2 coleções em destaque -->
      <h2 id="titulo-2">Coleções em destaque</h2>

      <div class="global-container-title2">
        <div class="icons">
          <div class="icon-camiseta">
            <img src="./Assets/Group 53586.png" alt="icon-camiseta" />
            <h6>Camisetas</h6>
          </div>
          <div class="icon-calca">
            <img src="./Assets/Group 53586-1.png" alt="calça" />
            <h6 id="calca">Calças</h6>
          </div>
          <div class="icon-bone">
            <img id="Bone-Desenho" src="./Assets/bone.png" alt="boné" />
            <h6 id="bone">Bonés</h6>
          </div>
          <div class="icon-fone">
            <img src="./Assets/Group 53586-3.png" alt="headphone" />
            <h6 id="phone">Headphones</h6>
          </div>
          <div class="icon-tenis">
            <img src="./Assets/Group 53586-4.png" alt="tenis" />
            <h6 id="tenis">Tênis</h6>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
